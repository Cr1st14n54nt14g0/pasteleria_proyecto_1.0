<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastelería - Iniciar Sesión</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
 
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            animation: fadeInUp 0.6s ease-out;
        }
 
        .login-card:hover {
            transform: translateY(-5px);
        }
 
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
 
        .login-header i {
            font-size: 3.5rem;
            color: #764ba2;
            margin-bottom: 0.5rem;
        }
 
        .login-header h1 {
            font-weight: 600;
            color: #333;
            font-size: 1.8rem;
        }
 
        .login-header p {
            color: #888;
            font-size: 0.95rem;
        }
 
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
 
        .form-control {
            border-radius: 50px;
            padding: 0.75rem 1.2rem 0.75rem 2.8rem;
            border: 1px solid #e0e0e0;
            transition: all 0.2s;
        }
 
        .form-control:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 0.2rem rgba(118, 75, 162, 0.25);
        }
 
        .input-group-text {
            background: transparent;
            border: none;
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            z-index: 10;
        }
 
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            padding: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            width: 100%;
            color: white;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.3);
        }
 
        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 28px rgba(118, 75, 162, 0.4);
            color: white;
        }
 
        .alert-danger {
            border-radius: 50px;
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }
 
        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #888;
            font-size: 0.9rem;
        }
 
        .footer-link a {
            color: #764ba2;
            text-decoration: none;
            font-weight: 500;
        }
 
        .footer-link a:hover {
            text-decoration: underline;
        }
 
        @media (max-width: 480px) {
            .login-card {
                padding: 1.8rem;
                margin: 1rem;
            }
            .login-header h1 {
                font-size: 1.5rem;
            }
        }
 
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
 
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>
 
    <div class="login-card">
        <div class="login-header">
            {% load static %}
            <img src="{% static 'img/logo.png' %}" alt="Logo" height="120" class="d-inline-block align-text-top">
            <h1>Pasteleria Fina Londres</h1>
            <p>Ingresa a tu cuenta</p>
        </div>
 
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
 
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" name="usuario" class="form-control" placeholder="Usuario" required autofocus>
            </div>
 
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" name="contrasena" class="form-control" placeholder="Contraseña" required>
            </div>
 
            {% if error %}
                <div class="alert alert-danger text-center" role="alert">
                    <i class="fas fa-exclamation-circle"></i> {{ error }}
                </div>
            {% endif %}
 
            <button type="submit" class="btn btn-login">
                <i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión
            </button>
 
            <div class="footer-link">
                ¿No tienes cuenta? <a href="#">Contacta al administrador</a><br>
                <a href="{% url 'menu_publico' %}">Ver nuestro menú</a>
            </div>
        </form>
    </div>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
