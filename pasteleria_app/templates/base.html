<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pastelería{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding-top: 70px; }
        .navbar-brand { font-weight: bold; }
        .nav-item.active a { background-color: #0d6efd; color: white !important; border-radius: 5px; }
    </style>
</head>
<body>
    <!-- Barra superior en escritorio (opcional) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'dashboard' %}">Pastelería</a>
            <div class="d-flex">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">Hola, {{ user.username }}</span>
                    <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Iniciar sesión</a>
                {% endif %}
            </div>
        </div>
    </nav>
 
    <!-- Botón hamburguesa visible en móviles -->
    <div class="d-md-none bg-light p-2 border-bottom">
        <button class="btn btn-outline-secondary" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
            ☰ Menú
        </button>
    </div>
 
    <!-- Menú lateral offcanvas -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
        <div class="offcanvas-header">
            <h4 class="fw-bold">Pastelería</h4>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav flex-column">
                <li class="nav-item mb-2 {% if active_page == 'dashboard' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'dashboard' %}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                </li>
                <li class="nav-item mb-2 {% if active_page == 'pedidos' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'lista_pedidos' %}"><i class="fas fa-box"></i> Pedidos</a>
                </li>
                <li class="nav-item mb-2 {% if active_page == 'productos' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'lista_productos' %}"><i class="fas fa-birthday-cake"></i> Productos</a>
                </li>
                <li class="nav-item mb-2 {% if active_page == 'clientes' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'lista_clientes' %}"><i class="fas fa-user"></i> Clientes</a>
                </li>
                <li class="nav-item mb-2 {% if active_page == 'reportes' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'reportes' %}"><i class="fas fa-chart-line"></i> Reportes</a>
                </li>
                <li class="nav-item mb-2 {% if active_page == 'configuracion' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'configuracion' %}"><i class="fas fa-cog"></i> Configuración</a>
                </li>
            </ul>
        </div>
    </div>
 
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
