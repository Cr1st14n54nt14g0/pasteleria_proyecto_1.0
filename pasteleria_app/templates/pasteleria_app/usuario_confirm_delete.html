{% extends 'pasteleria_app/base.html' %}
{% block title %}Eliminar Usuario{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>¿Estás seguro de eliminar al usuario "{{ object.usuario }}"?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'lista_usuarios' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
