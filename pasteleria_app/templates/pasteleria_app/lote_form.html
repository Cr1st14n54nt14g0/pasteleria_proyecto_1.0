{% extends 'pasteleria_app/base.html' %}
{% block title %}Nuevo Lote{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Nuevo Lote</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'lista_lotes' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
