{% extends 'pasteleria_app/base.html' %}
{% block title %}Retirar del Mostrador{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>¿Estás seguro de retirar "{{ object.id_producto.nombre }}" del mostrador?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, retirar</button>
        <a href="{% url 'lista_mostrador' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
