<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pastelería Fina Londres{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            padding-top: 70px;
            background-color: #fff8f5;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background-color: #d17b88 !important;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.4rem;
            color: #fff !important;
        }

        .navbar-text {
            color: #ffeef2 !important;
        }

        .btn-outline-light {
            border-color: #ffeef2;
            color: #ffeef2;
        }

        .btn-outline-light:hover {
            background-color: #ffeef2;
            color: #d17b88;
        }

        .sidebar {
            background-color: #fce4ec;
            border-right: 2px solid #f8bbd0;
        }

        .sidebar h4 {
            color: #d17b88;
        }

        .nav-link {
            color: #6d4c41;
            font-weight: 500;
        }

        .nav-link:hover {
            background-color: #f8bbd0;
            border-radius: 5px;
            color: #fff !important;
        }

        .nav-item.active a {
            background-color: #d17b88;
            color: #fff !important;
            border-radius: 5px;
        }

        main {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
    </style>
    
</head>
<body>
    <!-- Barra superior fija con botón hamburguesa integrado -->
    <nav class="navbar navbar-expand-md navbar-dark fixed-top">


        <div class="container-fluid">
            <button class="navbar-toggler d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand" href="{% url 'dashboard' %}">Pastelería Fina Londres</a>
            <div class="d-flex">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">Hola, {{ user.usuario }}</span>
                    <form method="post" action="{% url 'logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Iniciar sesión</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Menú lateral fijo (pantallas medianas y grandes) -->
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-none d-md-block sidebar">
                <div class="d-flex flex-column align-items-start mt-4 px-3">
                    <h4 class="fw-bold mb-4">Pastelería</h4>
                    <ul class="nav flex-column">
                        {% include 'pasteleria_app/_menu.html' %}
                    </ul>
                </div>
            </nav>

            <!-- Contenido principal -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Menú offcanvas para móviles -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
        <div class="offcanvas-header">
            <h4 class="fw-bold">Pastelería</h4>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav flex-column">
                {% include 'pasteleria_app/_menu.html' %}
            </ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
