<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pastelería{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { padding-top: 10px; }
    .navbar-brand { font-weight: bold; }
    .nav-item.active a { background-color: #0d6efd; color: white !important; border-radius: 5px; }
  </style>
</head>
<body>
  <!-- Botón hamburguesa visible en móviles -->
  <div class="d-md-none bg-light p-2 border-bottom">
    <button class="btn btn-outline-secondary" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
      ☰ Menú
    </button>
  </div>
  <!-- Menú lateral fijo en pantallas grandes -->
  <div class="d-none d-md-block bg-light border-end vh-100 position-fixed" style="width: 220px;">
    <div class="p-3">
      <h4 class="fw-bold">Pastelería</h4>
      <ul class="nav flex-column mt-3">
<li class="nav-item mb-2 {% if active_page == 'dashboard' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'dashboard' %}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                </li>
                <li class="nav-item mb-2 {% if active_page == 'pedidos' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'lista_pedidos' %}"><i class="fas fa-box"></i> Pedidos</a>
                </li>
                <li class="nav-item mb-2 {% if active_page == 'productos' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'lista_productos' %}"><i class="fas fa-birthday-cake"></i> Productos</a>
                </li>
                <li class="nav-item mb-2 {% if active_page == 'inventario' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'inventario' %}"><i class="fas fa-warehouse"></i> Inventario</a>
                </li>
                <li class="nav-item mb-2 {% if active_page == 'insumos' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'lista_insumos' %}"><i class="fas fa-flask"></i> Insumos</a>
                </li>
                <li class="nav-item mb-2 {% if active_page == 'clientes' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'lista_clientes' %}"><i class="fas fa-users"></i> Clientes</a>
                </li>
                <li class="nav-item mb-2 {% if active_page == 'mantenimiento' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'mantenimiento_equipos' %}"><i class="fas fa-tools"></i> Mantenimiento</a>
                </li>
                <li class="nav-item mb-2 {% if active_page == 'reportes' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'reportes' %}"><i class="fas fa-chart-bar"></i> Reportes</a>
                </li>
                <li class="nav-item mb-2 {% if active_page == 'configuracion' %}active{% endif %}">
                    <a class="nav-link" href="{% url 'configuracion' %}"><i class="fas fa-cog"></i> Configuración</a>
                </li>
        </li>
      </ul>
    </div>
  </div>


  <!-- Menú offcanvas solo para móviles -->
  <div class="offcanvas offcanvas-start d-md-none" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header">
      <h4 class="fw-bold">Pastelería</h4>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item mb-2"><a class="nav-link" href="#"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
        <li class="nav-item mb-2 {% if active_page == 'mantenimiento' %}active{% endif %}">
            <a class="nav-link" href="{% url 'mantenimiento_equipos' %}"><i class="fas fa-tools"></i> Mantenimiento</a>
        </li>
        <li class="nav-item mb-2"><a class="nav-link" href="#"><i class="fas fa-box"></i> Pedidos</a></li>
        <li class="nav-item mb-2"><a class="nav-link" href="#"><i class="fas fa-birthday-cake"></i> Productos</a></li>
        <li class="nav-item mb-2"><a class="nav-link" href="#"><i class="fas fa-user"></i> Clientes</a></li>
        <li class="nav-item mb-2"><a class="nav-link" href="#"><i class="fas fa-chart-line"></i> Reportes</a></li>
        <li class="nav-item mb-2"><a class="nav-link" href="#"><i class="fas fa-cog"></i> Configuración</a></li>
      </ul>
    </div>
  </div>
  <!-- Ajuste del contenido principal -->
  <main class="container mt-4" style="margin-left: 220px;">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
