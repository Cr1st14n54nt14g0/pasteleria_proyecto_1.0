{% extends 'pasteleria_app/base.html' %}
{% block title %}Abrir Caja{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2><i class="fas fa-cash-register"></i> Abrir Caja</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="monto_inicial" class="form-label">Monto inicial:</label>
            <input type="number" step="0.01" name="monto_inicial" id="monto_inicial" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Abrir Caja</button>
    </form>
</div>
{% endblock %}
