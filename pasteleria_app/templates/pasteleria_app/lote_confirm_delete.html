{% extends 'pasteleria_app/base.html' %}
{% block title %}Eliminar Lote{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>¿Estás seguro de eliminar el lote de "{{ object.id_insumo.nombre_insumo }}"?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'lista_lotes' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
